name: Update live WQI data

on:
  schedule:
    - cron: "7 * * * *"   # every hour at minute 7 (UTC); DOE data is hourly
  workflow_dispatch:       # lets you run it by hand from the Actions tab

permissions:
  contents: write          # needed so the job can commit the updated CSV files

concurrency:
  group: live-wqi
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install requests

      - name: Fetch live WQI
        run: python scripts/fetch_live_wqi.py

      - name: Commit updated data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add vercel-site/data/live_latest.csv vercel-site/data/live_history.csv vercel-site/data/live_meta.json
          if git diff --cached --quiet; then
            echo "No changes to commit"
          else
            git commit -m "chore: update live WQI data"
            git pull --rebase
            git push
          fi
