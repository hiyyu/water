services:
  - type: web
    name: water-quality-dashboard
    runtime: python
    plan: free
    buildCommand: pip install -r requirements-deploy.txt
    startCommand: streamlit run app.py --server.address 0.0.0.0 --server.port $PORT --server.headless true --server.enableCORS false --server.enableXsrfProtection true
    healthCheckPath: /_stcore/health
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.8
